[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemloop-studio"
version = "0.1.0"
description = "Self-auditing RAG and active-learning planner for polymer and materials R&D."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Burhan Beycan"}
]
keywords = [
  "RAG",
  "materials informatics",
  "polymer informatics",
  "active learning",
  "scientific machine learning",
  "experiment planning"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.0",
  "scikit-learn>=1.3",
  "typer>=0.12",
  "rich>=13.0"
]

[project.optional-dependencies]
app = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "streamlit>=1.34"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4"
]

[project.scripts]
chemloop = "chemloop_studio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
